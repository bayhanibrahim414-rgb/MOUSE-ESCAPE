<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mouse Escape">
<title>Mouse Escape</title>

<!-- Ana ekran ve sekme ikonu (Script ile hareketli logodaki fare görseli otomatik atanır) -->
<link id="appAppleIcon" rel="apple-touch-icon" sizes="180x180" href="">
<link id="appFavicon" rel="icon" type="image/png" href="">

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #090d18;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        touch-action: none;
        color: #ffffff;
    }

    #app {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 18%, #1e2d4d 0%, transparent 45%),
            linear-gradient(155deg, #0f172a, #040711);
    }

    .screen {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 10;
    }

    .screen.active {
        display: flex;
    }

    /* ANA MENÜ & LOGO SAHNESİ */

    #menuScreen {
        background:
            radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.24), transparent 48%),
            linear-gradient(160deg, #0f172a, #030712);
        overflow: hidden;
    }

    .logo-stage {
        position: relative;
        width: 100vw;
        height: 104px;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
    }

    .logo-track-line {
        position: absolute;
        bottom: 10px;
        width: min(260px, 65vw);
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(96, 165, 250, 0.35), transparent);
        border-radius: 2px;
    }

    .logo-actor {
        position: absolute;
        width: 78px;
        height: 78px;
        display: flex;
        align-items: center;
        justify-content: center;
        will-change: transform, opacity;
        filter: drop-shadow(0 12px 22px rgba(0, 0, 0, 0.55));
    }

    .logo-actor svg {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    .logo-bob {
        animation: logoIdleBob 2.2s ease-in-out infinite;
    }

    @keyframes logoIdleBob {
        0%, 100% { transform: translateY(0) rotate(-2deg); }
        50% { transform: translateY(-9px) rotate(2deg); }
    }

    .alert-badge {
        position: absolute;
        top: -16px;
        left: 50%;
        transform: translateX(-50%) scale(0);
        background: #ef4444;
        color: #fff;
        font-weight: 900;
        font-size: 14px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 16px rgba(239, 68, 68, 0.8);
        opacity: 0;
        transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s;
    }

    .alert-badge.show {
        transform: translateX(-50%) scale(1);
        opacity: 1;
    }

    .alert-badge.warn {
        background: #f59e0b;
        box-shadow: 0 0 16px rgba(245, 158, 11, 0.85);
    }

    h1 {
        font-size: clamp(38px, 10.5vw, 66px);
        margin: 4px 0 6px;
        letter-spacing: 3px;
        text-align: center;
        font-weight: 900;
        background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .subtitle {
        color: #94a3b8;
        text-align: center;
        margin-bottom: 34px;
        font-size: 14px;
        letter-spacing: 0.4px;
    }

    .menu-buttons {
        width: min(340px, 100%);
        display: flex;
        flex-direction: column;
        gap: 13px;
    }

    button {
        border: none;
        color: white;
        font-size: 16px;
        font-weight: 700;
        border-radius: 18px;
        padding: 17px 20px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: 0.18s transform, 0.18s filter, 0.18s background, 0.18s border-color;
    }

    button:active {
        transform: scale(0.96);
    }

    .btn-icon {
        width: 22px;
        height: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .primary {
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
    }

    .secondary {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
    }

    .secondary:hover .gear-spin {
        transform: rotate(45deg);
    }

    .gear-spin {
        transition: transform 0.35s ease;
    }

    .best-score {
        margin-top: 26px;
        color: #94a3b8;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .best-score strong {
        color: #fbbf24;
        font-size: 18px;
        font-variant-numeric: tabular-nums;
    }

    /* OYUN EKRANI */

    #gameScreen {
        padding: 0;
        background: #090d18;
        touch-action: none;
    }

    #gameArea {
        position: absolute;
        inset: 0;
        overflow: hidden;
        cursor: none;
        touch-action: none;
        background:
            linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px),
            radial-gradient(circle at center, #17233f 0%, #070b14 78%);
        background-size: 40px 40px, 40px 40px, 100% 100%;
    }

    .hud {
        position: absolute;
        top: max(16px, env(safe-area-inset-top));
        left: 16px;
        right: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 50;
        pointer-events: none;
    }

    .hud-box {
        padding: 10px 15px;
        border-radius: 16px;
        background: rgba(5, 8, 18, 0.76);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.09);
        font-weight: 800;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        font-variant-numeric: tabular-nums;
    }

    #levelText {
        color: #fbbf24;
    }

    #player {
        position: absolute;
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translate(-50%, -50%);
        z-index: 20;
        pointer-events: none;
        filter: drop-shadow(0 6px 12px rgba(59, 130, 246, 0.35));
        will-change: left, top, transform;
    }

    #player svg, .enemy svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    .enemy {
        position: absolute;
        width: 54px;
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translate(-50%, -50%);
        z-index: 15;
        pointer-events: none;
        filter: drop-shadow(0 6px 12px rgba(239, 68, 68, 0.35));
        will-change: left, top, transform;
    }

    .enemy::after {
        content: "";
        position: absolute;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid rgba(239, 68, 68, 0.28);
        animation: enemyPulse 1.1s infinite;
    }

    @keyframes enemyPulse {
        0% { transform: scale(0.8); opacity: 0.85; }
        100% { transform: scale(1.75); opacity: 0; }
    }

    .danger {
        animation: dangerFlash 0.35s infinite alternate;
    }

    @keyframes dangerFlash {
        from { box-shadow: inset 0 0 0 rgba(239, 68, 68, 0); }
        to { box-shadow: inset 0 0 85px rgba(239, 68, 68, 0.22); }
    }

    .level-popup {
        position: absolute;
        left: 50%;
        top: 44%;
        transform: translate(-50%, -50%) scale(0.7);
        font-size: clamp(24px, 6.8vw, 42px);
        font-weight: 900;
        text-align: center;
        opacity: 0;
        z-index: 60;
        pointer-events: none;
        color: #fbbf24;
        text-shadow: 0 5px 28px rgba(251, 191, 36, 0.5);
        line-height: 1.25;
    }

    .level-popup small {
        display: block;
        font-size: 0.45em;
        color: #f8fafc;
        letter-spacing: 1px;
        margin-top: 4px;
    }

    .level-popup.show {
        animation: popup 2s ease forwards;
    }

    @keyframes popup {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
        20% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
        80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -65%) scale(0.9); }
    }

    /* AYARLAR */

    #settingsScreen {
        padding-top: max(68px, calc(env(safe-area-inset-top) + 56px));
    }

    .fixed-back-btn {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        left: 16px;
        width: 46px;
        height: 46px;
        padding: 0;
        border-radius: 15px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        z-index: 100;
        color: #f8fafc;
    }

    .fixed-back-btn:active {
        transform: scale(0.92);
        background: rgba(59, 130, 246, 0.25);
    }

    .panel {
        width: min(480px, 100%);
        max-height: 84vh;
        overflow-y: auto;
        touch-action: pan-y;
        padding: 22px;
        border-radius: 28px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.55);
    }

    .panel-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 6px;
    }

    .panel-header h2 {
        margin: 0;
        font-size: 25px;
        letter-spacing: 0.5px;
    }

    .setting-title {
        color: #94a3b8;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        margin: 20px 0 10px;
    }

    .choices {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }

    .choice {
        padding: 12px 6px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid rgba(255, 255, 255, 0.04);
        text-align: center;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: 0.16s transform, 0.16s border-color, 0.16s background;
    }

    .choice:active {
        transform: scale(0.95);
    }

    .choice-preview {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .choice-preview svg {
        width: 100%;
        height: 100%;
    }

    .choice span {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: #cbd5e1;
        margin-top: 6px;
    }

    .choice.selected {
        border-color: #3b82f6;
        background: rgba(59, 130, 246, 0.16);
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
    }

    .sound-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.05);
        padding: 14px 16px;
        border-radius: 16px;
        margin-bottom: 10px;
        font-weight: 600;
        font-size: 15px;
    }

    .sound-label {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .switch {
        width: 52px;
        height: 28px;
        background: #334155;
        border-radius: 20px;
        position: relative;
        cursor: pointer;
        transition: 0.2s;
    }

    .switch::after {
        content: "";
        width: 22px;
        height: 22px;
        position: absolute;
        top: 3px;
        left: 3px;
        border-radius: 50%;
        background: white;
        transition: 0.2s;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .switch.on {
        background: #2563eb;
    }

    .switch.on::after {
        left: 27px;
    }

    /* OYUN SONU */

    #gameOverScreen {
        background: rgba(2, 6, 23, 0.88);
        backdrop-filter: blur(14px);
    }

    .gameover-icon {
        width: 84px;
        height: 84px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 6px;
        filter: drop-shadow(0 10px 25px rgba(239, 68, 68, 0.45));
    }

    .gameover-icon svg {
        width: 100%;
        height: 100%;
    }

    #gameOverScreen h2 {
        margin: 6px 0 2px;
        font-size: 30px;
        letter-spacing: 1.5px;
    }

    .final-time {
        font-size: 52px;
        font-weight: 900;
        color: #fbbf24;
        margin: 8px 0;
        font-variant-numeric: tabular-nums;
    }

    .final-info {
        color: #94a3b8;
        text-align: center;
        margin-bottom: 26px;
        line-height: 1.5;
        font-size: 15px;
    }

    .gameover-buttons {
        width: min(330px, 100%);
        display: flex;
        flex-direction: column;
        gap: 11px;
    }

    #touchHint {
        position: absolute;
        bottom: max(22px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.38);
        font-size: 12px;
        pointer-events: none;
        text-align: center;
        white-space: nowrap;
        z-index: 40;
    }

    .particle {
        position: absolute;
        pointer-events: none;
        border-radius: 50%;
        animation: explode 0.7s ease-out forwards;
    }

    @keyframes explode {
        to {
            transform: translate(var(--x), var(--y)) scale(0);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div id="app">

    <!-- ANA MENÜ -->
    <section id="menuScreen" class="screen active">
        <div class="logo-stage" id="logoStage">
            <div class="logo-track-line"></div>
            <div class="logo-actor" id="logoMouse">
                <div class="alert-badge" id="mouseAlert">!</div>
                <div class="logo-bob" id="logoMouseInner"></div>
            </div>
            <div class="logo-actor" id="logoCat" style="opacity: 0;">
                <div class="alert-badge warn" id="catAlert">!</div>
                <div id="logoCatInner"></div>
            </div>
        </div>

        <h1>MOUSE ESCAPE</h1>
        <div class="subtitle">Kaç. Hayatta kal. Yakalanma!</div>

        <div class="menu-buttons">
            <button class="primary" id="playButton">
                <span class="btn-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                        <path d="M7 4.5v15l12-7.5-12-7.5z"/>
                    </svg>
                </span>
                <span>OYNA</span>
            </button>
            <button class="secondary" id="settingsButton">
                <span class="btn-icon gear-spin" id="menuSettingsIcon"></span>
                <span>AYARLAR</span>
            </button>
        </div>

        <div class="best-score">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fbbf24" stroke-width="2.2">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
            </svg>
            <span>En iyi süre:</span>
            <strong id="bestScore">00:00</strong>
        </div>
    </section>

    <!-- AYARLAR -->
    <section id="settingsScreen" class="screen">
        <button class="fixed-back-btn" id="backButton" aria-label="Geri">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </button>

        <div class="panel">
            <div class="panel-header">
                <span class="btn-icon" id="panelSettingsIcon" style="width:26px;height:26px;"></span>
                <h2>Ayarlar</h2>
            </div>

            <div class="setting-title">Senin görünümün</div>
            <div class="choices" id="playerChoices"></div>

            <div class="setting-title">Takipçi görünümü</div>
            <div class="choices" id="enemyChoices"></div>

            <div class="setting-title">Ses & Müzik</div>

            <div class="sound-row">
                <div class="sound-label">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 18V5l12-2v13"/>
                        <circle cx="6" cy="18" r="3"/>
                        <circle cx="18" cy="16" r="3"/>
                    </svg>
                    <span>Oyun Müziği</span>
                </div>
                <div class="switch on" id="musicSwitch"></div>
            </div>

            <div class="sound-row">
                <div class="sound-label">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                    </svg>
                    <span>Ses Efektleri</span>
                </div>
                <div class="switch on" id="soundSwitch"></div>
            </div>
        </div>
    </section>

    <!-- OYUN -->
    <section id="gameScreen" class="screen">
        <div id="gameArea"></div>

        <div class="hud">
            <div class="hud-box">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#60a5fa" stroke-width="2.4" stroke-linecap="round">
                    <circle cx="12" cy="13" r="8"/>
                    <path d="M12 9v4l2.5 1.5M9 2h6"/>
                </svg>
                <span id="timeText">00:00</span>
            </div>
            <div class="hud-box" id="levelText">SEVİYE 1</div>
        </div>

        <div id="player"></div>
        <div id="levelPopup" class="level-popup"></div>

        <div id="touchHint">Parmağınla veya mouse ile kaç!</div>
    </section>

    <!-- OYUN SONU -->
    <section id="gameOverScreen" class="screen">
        <div class="gameover-icon" id="gameOverIcon"></div>
        <h2>YAKALANDIN!</h2>
        <div class="final-time" id="finalTime">00:00</div>
        <div class="final-info" id="finalInfo">Takipçiler seni yakaladı.</div>

        <div class="gameover-buttons">
            <button class="primary" id="restartButton">
                <span class="btn-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                </span>
                <span>TEKRAR OYNA</span>
            </button>
            <button class="secondary" id="menuButton">
                <span class="btn-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 10.5L12 3l9 7.5"/>
                        <path d="M5 9.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/>
                    </svg>
                </span>
                <span>ANA MENÜ</span>
            </button>
        </div>
    </section>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    /* EKRAN BÜYÜTME, BÜYÜTEÇ VE SEÇİM ENGELLEME */
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("selectstart", e => e.preventDefault());
    document.addEventListener("dragstart", e => e.preventDefault());

    ["gesturestart", "gesturechange", "gestureend"].forEach(evt => {
        document.addEventListener(evt, e => e.preventDefault(), { passive: false });
    });

    document.addEventListener("touchstart", e => {
        if (e.touches.length > 1) {
            e.preventDefault();
        }
    }, { passive: false });

    document.addEventListener("touchmove", e => {
        if (e.touches.length > 1) {
            e.preventDefault();
        }
    }, { passive: false });

    let lastTouchEnd = 0;
    document.addEventListener("touchend", e => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
            e.preventDefault();
        }
        lastTouchEnd = now;
    }, { passive: false });

    document.addEventListener("wheel", e => {
        if (e.ctrlKey) e.preventDefault();
    }, { passive: false });

    /* OYUNA ÖZEL VEKTÖREL GÖRÜNÜMLER (SVG) */

    const CUSTOM_GEAR_SVG = `
        <svg viewBox="0 0 36 36" width="100%" height="100%" fill="none">
            <defs>
                <linearGradient id="gearGrad" x1="0" y1="0" x2="36" y2="36">
                    <stop offset="0%" stop-color="#60a5fa"/>

    (function applyLogoMouseAsAppIcon() {
        const size = 512;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");

        // İkon arka planı (oyun temasına uyumlu koyu lacivert degrade)
        const bgGrad = ctx.createLinearGradient(0, 0, size, size);
        bgGrad.addColorStop(0, "#1e293b");
        bgGrad.addColorStop(1, "#090d18");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, size, size);

        // Hafif mavi parlama efekti
        const glow = ctx.createRadialGradient(size * 0.5, size * 0.45, 20, size * 0.5, size * 0.5, size * 0.48);
        glow.addColorStop(0, "rgba(59, 130, 246, 0.35)");
        glow.addColorStop(1, "rgba(59, 130, 246, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, size, size);

        // Hareketli logodaki fare SVG'sini PNG'ye çevir ve ekle
        const rawMouseSvg = PLAYER_SKINS.mouse.svg.trim().replace(
            "<svg ",
            '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" '
        );
        const svgBlob = new Blob([rawMouseSvg], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(svgBlob);
        const img = new Image();

        img.onload = () => {
            const pad = 54;
            ctx.drawImage(img, pad, pad, size - pad * 2, size - pad * 2);
            URL.revokeObjectURL(url);

            const pngDataUrl = canvas.toDataURL("image/png");
            const appleIcon = document.getElementById("appAppleIcon");
            const favIcon = document.getElementById("appFavicon");
            if (appleIcon) appleIcon.href = pngDataUrl;
            if (favIcon) favIcon.href = pngDataUrl;
        };
        img.src = url;
    })();

    const logoMouse = document.getElementById("logoMouse");

    let logoTimers = [];
    let chaseDirection = 1;

    function clearLogoTimers() {
        logoTimers.forEach(id => clearTimeout(id));
        logoTimers = [];
    }

    function scheduleLogo(fn, delay) {
        const id = setTimeout(fn, delay);
        logoTimers.push(id);
        return id;
    }

    function stopLogoChaseLoop() {
        clearLogoTimers();
    }

    function resetLogoActors() {
        logoMouse.style.transition = "none";
        logoMouse.style.opacity = "1";
        logoMouse.style.transform = "translateX(0px) scaleX(1)";
        mouseAlert.classList.remove("show");

        logoCat.style.transition = "none";
        logoCat.style.opacity = "0";
        logoCat.style.transform = "translateX(0px) scaleX(1)";
        catAlert.classList.remove("show");
    }

    function startLogoChaseLoop() {
        clearLogoTimers();
        resetLogoActors();

        function runCycle() {
            if (!screens.menu.classList.contains("active")) return;

            const dir = chaseDirection;
            chaseDirection *= -1;
            const offscreenDist = Math.max(window.innerWidth * 0.62, 240);

            // 1) Fare bir süre merkezde bekler
            logoMouse.style.transition = "transform 0.3s ease";
            logoMouse.style.opacity = "1";
            logoMouse.style.transform = `translateX(0px) scaleX(${dir})`;
            mouseAlert.classList.remove("show");
            catAlert.classList.remove("show");
            logoCat.style.opacity = "0";

            // 2) Fare tehlikeyi fark eder ve bir yöne kaçar
            scheduleLogo(() => {
                mouseAlert.classList.add("show");
            }, 2600);

            scheduleLogo(() => {
                mouseAlert.classList.remove("show");
                logoMouse.style.transition = "transform 0.62s cubic-bezier(0.4, 0, 0.2, 1)";
                logoMouse.style.transform = `translateX(${dir * offscreenDist}px) scaleX(${dir})`;
            }, 2950);

            // 3) Kedi sahneye gelir ve sağa sola bakar
            scheduleLogo(() => {
                logoCat.style.transition = "none";
                logoCat.style.opacity = "1";
                logoCat.style.transform = `translateX(${-dir * offscreenDist}px) scaleX(${dir})`;

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        logoCat.style.transition = "transform 0.55s cubic-bezier(0.22, 1, 0.36, 1)";
                        logoCat.style.transform = `translateX(0px) scaleX(${dir})`;
                    });
                });
            }, 3450);

            // Kedi sola bakar
            scheduleLogo(() => {
                logoCat.style.transition = "transform 0.18s ease";
                logoCat.style.transform = "translateX(0px) scaleX(-1)";
            }, 4150);

            // Kedi sağa bakar
            scheduleLogo(() => {
                logoCat.style.transition = "transform 0.18s ease";
                logoCat.style.transform = "translateX(0px) scaleX(1)";
            }, 4650);

            // Kedi farenin kaçtığı yönü fark eder
            scheduleLogo(() => {
                logoCat.style.transition = "transform 0.15s ease";
                logoCat.style.transform = `translateX(0px) scaleX(${dir})`;
                catAlert.classList.add("show");
            }, 5100);

            // 4) Kedi farenin kaçtığı yöne doğru hızla gider
            scheduleLogo(() => {
                catAlert.classList.remove("show");
                logoCat.style.transition = "transform 0.58s cubic-bezier(0.4, 0, 0.2, 1)";
                logoCat.style.transform = `translateX(${dir * offscreenDist}px) scaleX(${dir})`;
            }, 5420);

            // 5) Diğer taraftan fare tekrar sahneye gelir
            scheduleLogo(() => {
                logoCat.style.opacity = "0";
                logoMouse.style.transition = "none";
                logoMouse.style.transform = `translateX(${-dir * offscreenDist}px) scaleX(${dir})`;

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        logoMouse.style.transition = "transform 0.75s cubic-bezier(0.22, 1, 0.36, 1)";
                        logoMouse.style.transform = `translateX(0px) scaleX(${dir})`;
                    });
                });
            }, 6150);

            // Döngüyü tekrarla
            scheduleLogo(runCycle, 7100);
        }

        runCycle();
    }

    function initAudio() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioContext.state === "suspended") {
            audioContext.resume();
        }
    }

    function playTone(freq, duration, type = "sine", volume = 0.06) {
        if (!soundEnabled) return;

        try {
            initAudio();

            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();

            oscillator.type = type;
            oscillator.frequency.setValueAtTime(freq, audioContext.currentTime);

            gain.gain.setValueAtTime(volume, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.start();
            oscillator.stop(audioContext.currentTime + duration);
        } catch (e) {}
    }

    function buttonSound() {
        playTone(540, 0.07, "sine", 0.04);
    }

    function levelSound() {
        if (!soundEnabled) return;
        playTone(440, 0.1, "sawtooth", 0.05);
        setTimeout(() => playTone(554.37, 0.1, "sawtooth", 0.055), 85);
        setTimeout(() => playTone(659.25, 0.12, "sawtooth", 0.06), 170);
        setTimeout(() => playTone(880, 0.22, "sawtooth", 0.065), 255);
    }

    function gameOverSound() {
        if (!soundEnabled) return;
        playTone(310, 0.16, "sawtooth", 0.08);

    }

    function startMusic() {
        stopMusic();
        if (!musicEnabled) return;

        musicStep = 0;

        const bassPattern = [110, 110, 130.81, 116.54, 110, 110, 146.83, 138.59];
        const leadPattern = [440, 466.16, 523.25, 466.16, 440, 392, 415.30, 466.16];

        function scheduleNextBeat() {
            if (!gameRunning || !musicEnabled) return;

            const enemyFactor = Math.min(enemies.length, 32) / 32;
            const levelFactor = Math.min(level - 1, 8) / 8;
            const timeFactor = Math.min(elapsedSeconds / 180, 1);
            const dangerBoost = closestDistanceGlobal < 140 ? 0.18 : 0;

            const intensity = Math.min(1, levelFactor * 0.45 + enemyFactor * 0.35 + timeFactor * 0.2 + dangerBoost);

            const stepDelay = Math.max(102, Math.round(290 - intensity * 185));
            const pitchShift = 1 + intensity * 0.22;

            try {
                initAudio();
                const now = audioContext.currentTime;

                const bassOsc = audioContext.createOscillator();
                const bassGain = audioContext.createGain();
                bassOsc.type = intensity > 0.45 ? "sawtooth" : "triangle";
                bassOsc.frequency.setValueAtTime(
                    bassPattern[musicStep % bassPattern.length] * pitchShift,
                    now
                );

                const noteDur = Math.min(0.24, (stepDelay / 1000) * 0.85);
                bassGain.gain.setValueAtTime(0.03 + intensity * 0.02, now);
                bassGain.gain.exponentialRampToValueAtTime(0.001, now + noteDur);

                bassOsc.connect(bassGain);
                bassGain.connect(audioContext.destination);
                bassOsc.start(now);
                bassOsc.stop(now + noteDur + 0.01);

                if (intensity > 0.15 || musicStep % 2 === 1) {
                    const leadOsc = audioContext.createOscillator();
                    const leadGain = audioContext.createGain();
                    leadOsc.type = "sine";
                    leadOsc.frequency.setValueAtTime(
                        leadPattern[musicStep % leadPattern.length] * pitchShift,
                        now
                    );

                    const leadVol = 0.012 + intensity * 0.024;
                    leadGain.gain.setValueAtTime(leadVol, now);
                    leadGain.gain.exponentialRampToValueAtTime(0.001, now + noteDur * 0.75);

                    leadOsc.connect(leadGain);
                    leadGain.connect(audioContext.destination);
                    leadOsc.start(now);
                    leadOsc.stop(now + noteDur * 0.8);
                }

                musicStep++;
            } catch (e) {}

            musicTimeout = setTimeout(scheduleNextBeat, stepDelay);
        }

        scheduleNextBeat();
    }

    function stopMusic() {
        if (musicTimeout) {
            clearTimeout(musicTimeout);
            musicTimeout = null;
        }
    }

    /* AYAR ANAHTARLARI VE MENÜ BUTONLARI */

    musicSwitch.addEventListener("click", function() {
        buttonSound();
        musicEnabled = !musicEnabled;
        localStorage.setItem("mouseEscapeMusic", musicEnabled);
        this.classList.toggle("on", musicEnabled);

        if (gameRunning) {
            if (musicEnabled) startMusic();
            else stopMusic();
        }
    });

    soundSwitch.addEventListener("click", function() {
        soundEnabled = !soundEnabled;
        localStorage.setItem("mouseEscapeSound", soundEnabled);
        this.classList.toggle("on", soundEnabled);

        if (soundEnabled) buttonSound();
    });

    document.getElementById("playButton").addEventListener("click", () => {
        buttonSound();
        startGame();
    });

    document.getElementById("settingsButton").addEventListener("click", () => {
        buttonSound();
        showScreen("settings");
    });

    document.getElementById("backButton").addEventListener("click", () => {
        buttonSound();
        showScreen("menu");
    });

    document.getElementById("restartButton").addEventListener("click", () => {
        buttonSound();
        startGame();
    });

    document.getElementById("menuButton").addEventListener("click", () => {
        buttonSound();
        showScreen("menu");
    });

    /* OYUN BAŞLATMA VE DÖNGÜ */

    function startGame() {
        stopGame();
        showScreen("game");

        const selectedPlayer = PLAYER_SKINS[playerSkinKey] || PLAYER_SKINS.mouse;
        playerEl.innerHTML = selectedPlayer.svg;
        playerEl.style.opacity = "1";

        gameRunning = true;
        startTime = performance.now();
        lastTime = performance.now();
        elapsedSeconds = 0;
        level = 1;
        closestDistanceGlobal = Infinity;

        player.x = window.innerWidth / 2;
        player.y = window.innerHeight / 2;
        player.targetX = player.x;
        player.targetY = player.y;
        player.facing = 1;

        playerEl.style.left = player.x + "px";
        playerEl.style.top = player.y + "px";
        playerEl.style.transform = "translate(-50%, -50%) scaleX(1)";

        timeText.textContent = "00:00";
        levelText.textContent = "SEVİYE 1";

        clearEnemies();
        createEnemy();

        startMusic();

        showLevelPopup("SEVİYE 1<small>KAÇMAYA BAŞLA!</small>");

        animationId = requestAnimationFrame(gameLoop);
    }

    function stopGame() {
        gameRunning = false;

        if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }

        stopMusic();
        clearEnemies();
    }

    function clearEnemies() {
        enemies.forEach(enemy => {
            if (enemy.el) enemy.el.remove();
        });
        enemies = [];
    }

    /* TAKİPÇİ OLUŞTURMA VE ÇOĞALMA (HER 30 SANİYEDE BİR) */

    function createEnemy() {
        const selectedEnemy = ENEMY_SKINS[enemySkinKey] || ENEMY_SKINS.cat;
        const el = document.createElement("div");
        el.className = "enemy";
        el.innerHTML = selectedEnemy.svg;

        const padding = 60;
        let x, y;
        const side = Math.floor(Math.random() * 4);

        if (side === 0) {
            x = Math.random() * window.innerWidth;
            y = -padding;
        } else if (side === 1) {
            x = window.innerWidth + padding;
            y = Math.random() * window.innerHeight;
        } else if (side === 2) {
            x = Math.random() * window.innerWidth;
            y = window.innerHeight + padding;
        } else {
            x = -padding;
            y = Math.random() * window.innerHeight;
        }

        const enemy = {
            el,
            x,
            y,
            speed: 0.72 + (level * 0.11) + Math.random() * 0.22
        };

        el.style.left = x + "px";
        el.style.top = y + "px";

        gameArea.appendChild(el);
        enemies.push(enemy);
    }

    function levelUp() {
        level++;
        levelText.textContent = "SEVİYE " + level;

        const currentCount = enemies.length;
        const targetCount = Math.min(currentCount * 2, 32);

        while (enemies.length < targetCount) {
            createEnemy();
        }

        enemies.forEach(enemy => {
            enemy.speed *= 1.13;
        });

        levelSound();

        const enemyLabel = (ENEMY_SKINS[enemySkinKey] || ENEMY_SKINS.cat).label.toUpperCase();
        showLevelPopup(
            "SEVİYE " + level +
            "<small>" + enemies.length + " " + enemyLabel + " SENİ ARIYOR!</small>"
        );
    }

    function showLevelPopup(html) {
        levelPopup.innerHTML = html;
        levelPopup.classList.remove("show");
        void levelPopup.offsetWidth;
        levelPopup.classList.add("show");
    }

    /* OYUNCU KONTROLLERİ */

    function setPlayerTarget(x, y) {
        if (!gameRunning) return;

        const rect = gameArea.getBoundingClientRect();
        player.targetX = Math.max(26, Math.min(rect.width - 26, x - rect.left));
        player.targetY = Math.max(26, Math.min(rect.height - 26, y - rect.top));
    }

    gameArea.addEventListener("mousemove", e => {
        setPlayerTarget(e.clientX, e.clientY);
    });

    gameArea.addEventListener("touchstart", e => {
        e.preventDefault();
        if (e.touches[0]) {
            setPlayerTarget(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: false });

    gameArea.addEventListener("touchmove", e => {
        e.preventDefault();
        if (e.touches[0]) {
            setPlayerTarget(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: false });

    /* ANA OYUN DÖNGÜSÜ */

    function gameLoop(now) {
        if (!gameRunning) return;

        const delta = Math.min(now - lastTime, 35);
        lastTime = now;

        elapsedSeconds = (now - startTime) / 1000;
        timeText.textContent = formatTime(elapsedSeconds);

        const newLevel = Math.floor(elapsedSeconds / 30) + 1;
        if (newLevel > level) {
            levelUp();
        }

        const followSpeed = 0.24;
        const moveX = (player.targetX - player.x) * followSpeed;
        const moveY = (player.targetY - player.y) * followSpeed;

        player.x += moveX;
        player.y += moveY;

        if (Math.abs(moveX) > 0.35) {
            player.facing = moveX >= 0 ? 1 : -1;
        }

        playerEl.style.left = player.x + "px";
        playerEl.style.top = player.y + "px";
        playerEl.style.transform = `translate(-50%, -50%) scaleX(${player.facing})`;

        let closestDistance = Infinity;
        const timeStep = delta / 16.67;

        for (let i = 0; i < enemies.length; i++) {
            const enemy = enemies[i];
            const dx = player.x - enemy.x;
            const dy = player.y - enemy.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < closestDistance) {
                closestDistance = distance;
            }

            const safeDistance = Math.max(distance, 1);
            const speed =
                enemy.speed *
                (1 + Math.min(elapsedSeconds / 240, 0.7)) *
                timeStep;

            let vx = (dx / safeDistance) * speed;
            let vy = (dy / safeDistance) * speed;

            for (let j = 0; j < enemies.length; j++) {
                if (i === j) continue;
                const other = enemies[j];
                const sdx = enemy.x - other.x;
                const sdy = enemy.y - other.y;
                const sDist = Math.sqrt(sdx * sdx + sdy * sdy);
                if (sDist > 0 && sDist < 46) {
                    const push = ((46 - sDist) / 46) * 1.15 * timeStep;
                    vx += (sdx / sDist) * push;
                    vy += (sdy / sDist) * push;
                }
            }

            enemy.x += vx;
            enemy.y += vy;

            const enemyFacing = vx >= 0 ? 1 : -1;
            enemy.el.style.left = enemy.x + "px";
            enemy.el.style.top = enemy.y + "px";
            enemy.el.style.transform = `translate(-50%, -50%) scaleX(${enemyFacing})`;

            if (distance < 38) {
                gameOver();
                return;
            }
        }

        closestDistanceGlobal = closestDistance;

        if (closestDistance < 135) {
            gameArea.classList.add("danger");
        } else {
            gameArea.classList.remove("danger");
        }

        animationId = requestAnimationFrame(gameLoop);
    }

    /* OYUN SONU */

    function gameOver() {
        if (!gameRunning) return;

        gameRunning = false;
        gameArea.classList.remove("danger");

        if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }

        stopMusic();
        gameOverSound();

        playerEl.style.opacity = "0";
        createExplosion(player.x, player.y);

        const finalSeconds = Math.floor(elapsedSeconds);
        finalTime.textContent = formatTime(finalSeconds);

        const activeEnemy = ENEMY_SKINS[enemySkinKey] || ENEMY_SKINS.cat;
        gameOverIcon.innerHTML = activeEnemy.svg;

        if (finalSeconds > bestScore) {
            bestScore = finalSeconds;
            localStorage.setItem("mouseEscapeBest", bestScore);
            updateBestScore();

            finalInfo.innerHTML =
                "<strong>Yeni en iyi skor!</strong><br>" +
                "Seviye " + level + "'e kadar hayatta kaldın.";
        } else {
            finalInfo.innerHTML =
                activeEnemy.name + " seni yakaladı.<br>" +
                "Seviye " + level + "'e kadar dayandın!";
        }

        setTimeout(() => {
            clearEnemies();
            showScreen("gameOver");
        }, 650);
    }

    function createExplosion(x, y) {
        for (let i = 0; i < 26; i++) {
            const particle = document.createElement("div");
            particle.className = "particle";

            const size = 4 + Math.random() * 9;
            const angle = Math.random() * Math.PI * 2;
            const distance = 30 + Math.random() * 105;

            const px = Math.cos(angle) * distance + "px";
            const py = Math.sin(angle) * distance + "px";

            particle.style.width = size + "px";
            particle.style.height = size + "px";
            particle.style.left = x + "px";
            particle.style.top = y + "px";
            particle.style.background =
                ["#ef4444", "#fbbf24", "#38bdf8", "#ffffff"][Math.floor(Math.random() * 4)];

            particle.style.setProperty("--x", px);
            particle.style.setProperty("--y", py);

            gameArea.appendChild(particle);
            setTimeout(() => particle.remove(), 750);
        }
    }

    window.addEventListener("resize", () => {
        if (!gameRunning) return;

        player.x = Math.max(26, Math.min(player.x, window.innerWidth - 26));
        player.y = Math.max(26, Math.min(player.y, window.innerHeight - 26));
        player.targetX = player.x;
        player.targetY = player.y;
    });

});
</script>
